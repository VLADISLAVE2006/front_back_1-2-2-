events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server backend1:3000 max_fails=2 fail_timeout=30s;
        server backend2:3000 max_fails=2 fail_timeout=30s;
        server backend3:3000 max_fails=2 fail_timeout=30s backup;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend_servers/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /nginx_stats {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }
    }
}