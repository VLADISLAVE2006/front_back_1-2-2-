version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: voentorg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

  backend1:
    build: .
    container_name: voentorg-backend-1
    environment:
      - PORT=3000
      - SERVER_ID=backend-1
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=voentorg_secret_key_2025
    networks:
      - app-network
    depends_on:
      - redis

  backend2:
    build: .
    container_name: voentorg-backend-2
    environment:
      - PORT=3000
      - SERVER_ID=backend-2
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=voentorg_secret_key_2025
    networks:
      - app-network
    depends_on:
      - redis

  backend3:
    build: .
    container_name: voentorg-backend-3
    environment:
      - PORT=3000
      - SERVER_ID=backend-3
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=voentorg_secret_key_2025
    networks:
      - app-network
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: voentorg-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data: