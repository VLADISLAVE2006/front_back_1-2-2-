version: '3.8'

services:
  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: voentorg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - voentorg-network

  # Бэкенд сервер 1
  backend1:
    build: .
    container_name: voentorg-backend-1
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=voentorg_secret_key_2025
    ports:
      - "3001:3001"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - voentorg-network
    volumes:
      - uploads-data:/app/uploads

  # Бэкенд сервер 2
  backend2:
    build: .
    container_name: voentorg-backend-2
    environment:
      - PORT=3002
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=voentorg_secret_key_2025
    ports:
      - "3002:3002"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - voentorg-network
    volumes:
      - uploads-data:/app/uploads

  # Бэкенд сервер 3
  backend3:
    build: .
    container_name: voentorg-backend-3
    environment:
      - PORT=3003
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=voentorg_secret_key_2025
    ports:
      - "3003:3003"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - voentorg-network
    volumes:
      - uploads-data:/app/uploads

  # Nginx балансировщик
  nginx-lb:
    image: nginx:alpine
    container_name: voentorg-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - voentorg-network

  # HAProxy балансировщик
  haproxy-lb:
    image: haproxy:alpine
    container_name: voentorg-haproxy
    ports:
      - "8090:8090"
      - "8081:8081"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - voentorg-network

  # Фронтенд (React)
  frontend:
    build: ./client
    container_name: voentorg-frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx-lb
    restart: unless-stopped
    networks:
      - voentorg-network

networks:
  voentorg-network:
    driver: bridge

volumes:
  redis-data:
  uploads-data: