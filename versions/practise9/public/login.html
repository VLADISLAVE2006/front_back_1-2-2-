<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ВоенТорг</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>ВоенТорг</h1>
            <nav>
                <a href="/">Главная</a>
                <a href="/login.html" class="active">Вход</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="showTab('login')">Вход</button>
                <button class="tab-btn" onclick="showTab('register')">Регистрация</button>
            </div>

            <div id="loginForm" class="auth-form active">
                <h2>Вход в систему</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="loginEmail" value="admin@military.ru" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" id="loginPassword" value="admin123" required>
                    </div>
                    <button type="submit" class="btn-primary">Войти</button>
                </form>
            </div>

            <div id="registerForm" class="auth-form">
                <h2>Регистрация</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Имя:</label>
                        <input type="text" id="regFirstName" required>
                    </div>
                    <div class="form-group">
                        <label>Фамилия:</label>
                        <input type="text" id="regLastName" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" id="regPassword" required>
                    </div>
                    <button type="submit" class="btn-primary">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
</body>

</html>
