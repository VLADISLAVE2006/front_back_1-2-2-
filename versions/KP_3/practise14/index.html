<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Для Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4285f4">
    <meta name="application-name" content="Заметки">
    
    <!-- Для iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Заметки">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    
    <!-- Для Windows -->
    <meta name="msapplication-TileImage" content="icons/icon-144x144.png">
    <meta name="msapplication-TileColor" content="#4285f4">
    
    <!-- Обычный favicon -->
    <link rel="icon" href="icons/favicon.ico" sizes="16x16" type="image/x-icon">
    <link rel="shortcut icon" href="icons/favicon.ico">
    
    <title>Заметки - офлайн блокнот</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    
    <style>
        body {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #4285f4;
            font-size: 1.8rem;
        }
        #notes-list {
            margin-top: 20px;
            list-style: none;
            padding: 0;
        }
        #notes-list li {
            background: #f5f5f5;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            word-break: break-word;
        }
        button {
            background-color: #4285f4;
            border: none;
        }
        button:hover {
            background-color: #3367d6;
        }
    </style>
</head>

<body>
    <h1>📝 Мои заметки</h1>
    
    <form id="note-form" class="row">
        <input class="col-9" type="text" id="note-input" placeholder="Введите новую заметку..." required>
        <button class="col-3" type="submit">➕ Добавить</button>
    </form>
    
    <ul id="notes-list"></ul>
    
    <script src="app.js"></script>
</body>

</html>
